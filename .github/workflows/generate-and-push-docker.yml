name: Generate and Push Docker Images

on:
  push:
    tags:
      - 'docker-v*.*.*'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'docker/**'
      - 'scripts/**'
  workflow_dispatch:


jobs:
  detect:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Build Matrix
        id: detect
        run: |
          # Get the list of all dockerfiles in the repository
          ALL_DOCKERFILES=$(find docker -type f -name 'Dockerfile')

          # Initialize an empty array for the matrix
          MATRIX=()
          # Loop through all files and extract target, image, and dockerfile path
          for FILE in $ALL_DOCKERFILES; do
            if [[ $FILE == docker/*/Dockerfile ]]; then
              TARGET=$(echo $FILE | cut -d'/' -f2)
              IMAGE="liara-engine/${TARGET}"
              DOCKERFILE_PATH=$FILE
              MATRIX+=("{\"target\":\"$TARGET\", \"image\":\"$IMAGE\", \"dockerfile\":\"$DOCKERFILE_PATH\"}")
            fi
          done

          # Convert the array to a JSON string
          JSON=$(printf '%s\n' "${MATRIX[@]}" | jq -cs '.')

          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT

          # Debug output
          echo "Generated matrix: $JSON"

  build:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    uses: liara-engine/.github/.github/workflows/reusable-generate-docker.yml@v0

    with:
      target: ${{ matrix.target }}
      image-name: ${{ matrix.image }}
      image-tag: >-
        ${{ github.event_name == 'pull_request'
            && format('pr-{0}', github.event.pull_request.number)
            || github.ref_name }}
      tag-latest: >-
        ${{ github.event_name == 'push'
            && startsWith(github.ref, 'refs/tags/docker-v') }}

      dockerfile-path: ${{ matrix.dockerfile }}