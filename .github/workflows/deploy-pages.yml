name: deploy-pages.yml

on:
  push:
    branches:
      - main
    paths:
      - 'schemas/**'
      - 'version.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - run: |
          mkdir -p gh-pages

          if [ -d "schemas" ]; then
            cp -r schemas gh-pages/
          fi

          if [ -f "version.json" ]; then
            cp version.json gh-pages/
          fi

      - name: Upload as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5