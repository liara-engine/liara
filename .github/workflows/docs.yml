name: docs

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'book.toml'
      - 'manifest.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  docs:
    permissions:
        contents: write
        packages: read

    uses: liara-engine/.github/.github/workflows/reusable-docs.yml@v2
    with:
      image: ghcr.io/liara-engine/liara-documentation-builder:latest
      output-repository: liara-engine/liara-docs
      source-repository: liara-engine/liara
      repo: ${{ github.repository }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

    secrets:
      ghcr-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.DOCS_PUSH_TOKEN }}
